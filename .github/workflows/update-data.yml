name: 每日更新股價

on:
  schedule:
    # GitHub 的排程用 UTC 時間
    - cron: "17 7 * * 1-5"    # 台灣 15:17，台股收盤後
    - cron: "43 22 * * 1-5"   # 台灣隔天 06:43，美股收盤後
  workflow_dispatch:           # 也可以在 GitHub 網頁上手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: pip install requests yfinance
      - name: 抓最新股價
        run: python scripts/update_data.py
      - name: 有變動就存回專案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "更新股價 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi
