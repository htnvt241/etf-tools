name: 每日更新股價

on:
  schedule:
    # GitHub 的排程用 UTC 時間
    - cron: "17 7 * * 1-5"    # 台灣 15:17，台股收盤後
    - cron: "43 22 * * 1-5"   # 台灣隔天 06:43，美股收盤後
    # GitHub 的排程偶爾會延遲或漏跑，多排兩個備援時間（資料沒變就不會產生新紀錄）
    - cron: "37 9 * * 1-5"    # 台灣 17:37
    - cron: "11 1 * * 2-6"    # 台灣 09:11
  workflow_dispatch:           # 也可以在 GitHub 網頁上手動按「Run workflow」

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: pip install requests yfinance
      - name: 抓最新股價並檢查
        run: python scripts/update_data.py
      - name: 有變動就存回專案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "更新股價 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi
      - name: 資料檢查有問題就開 Issue 通知（會寄 email）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(python -c "import json;print(json.load(open('data/check.json'))['status'])")
          python scripts/check_report.py > report.md
          num=$(gh issue list --state open --label data-check --json number --jq '.[0].number' 2>/dev/null || true)
          if [ "$status" = "problem" ]; then
            gh label create data-check --color d93f0b --description "資料檢查" --force >/dev/null 2>&1 || true
            if [ -n "$num" ]; then
              gh issue comment "$num" -F report.md
            else
              gh issue create --title "⚠️ 股價資料檢查發現問題" --label data-check -F report.md
            fi
            echo "::error::資料檢查發現新問題，詳見 Issue"
            exit 1
          elif [ -n "$num" ]; then
            gh issue close "$num" -c "$(cat report.md)"
          fi
