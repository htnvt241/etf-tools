name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request,datetime
          for s in ["TWD=X","USDTWD=X","TWDUSD=X"]:
              u=f"https://query2.finance.yahoo.com/v8/finance/chart/{s}?period1=0&period2=1800000000&interval=1d"
              js=json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})))
              r=js["chart"]["result"][0]; ts=r["timestamp"]; c=r["indicators"]["quote"][0]["close"]
              pts=[(t,v) for t,v in zip(ts,c) if v]
              gaps=sorted(((pts[i][0]-pts[i-1][0])/86400,datetime.date.fromtimestamp(pts[i-1][0])) for i in range(1,len(pts)))[-4:]
              print(s,len(pts),datetime.date.fromtimestamp(pts[0][0]),gaps)
          PY
