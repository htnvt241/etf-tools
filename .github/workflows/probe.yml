name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://www.twse.com.tw/rwd/zh/TAIEX/MFI94U?date=20030101&response=json" \
                   "https://www.twse.com.tw/rwd/zh/TAIEX/MFI94U?date=20261101&response=json" \
                   "https://www.twse.com.tw/indicesReport/MFI94U?response=json&date=20261101"; do
            echo "== $u"; curl -sS -m 40 -A "Mozilla/5.0" "$u" | head -c 900 || true; echo; sleep 3; done
          exit 0
