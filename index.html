<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>市場儀表板｜ETF 工具箱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=1127a">
</head><body>
<div class="wrap">
<header id="top"></header>
<h1>市場儀表板</h1>

<div class="section-t">市場技術多空<span class="sub">（各策略用「預設參數」的最近一次買賣訊號；訊號在收盤後確定，隔天收盤成交）</span></div>
<div class="two" id="sig">
  <section class="card"><h3>台灣</h3><div class="tw"><table class="sigt" id="sig-tw"><tbody><tr><td class="loading">讀取中…</td></tr></tbody></table></div></section>
  <section class="card"><h3>美國</h3><div class="tw"><table class="sigt" id="sig-us"><tbody><tr><td class="loading">讀取中…</td></tr></tbody></table></div></section>
</div>

<div class="section-t">市場指數</div>
<div class="two" id="idx">
  <section class="card" id="c-TWII"><div class="loading">讀取中…</div></section>
  <section class="card" id="c-GSPC"><div class="loading">讀取中…</div></section>
</div>

<div class="section-t">ETF<span class="sub">（報酬含息；點卡片可直接去回測）</span></div>
<div class="tiles" id="tiles"></div>

<section class="card" id="check"><h3>資料檢查</h3><div class="loading">讀取中…</div></section>

<footer>資料來源：Yahoo Finance，每個交易日收盤後自動更新。指數為價格指數（不含股息），ETF 報酬以還原股價（含息）計算。本站僅供學習研究，不構成投資建議。</footer>
</div>
<script src="assets/core.js?v=1127a"></script>
<script src="assets/chart.js?v=1127a"></script>
<script src="assets/common.js?v=1127a"></script>
<script src="assets/signal-bt.js?v=1127a"></script>
<script src="assets/strategies.js?v=1127a"></script>
<script src="assets/signal-page.js?v=1127a"></script>
<script>
// ---- 市場技術多空：各策略預設參數的最近一次買賣（規則和策略頁共用 assets/strategies.js） ----
(function(){
  const US_DEF = { sp: { n: 150, x: 2, y: 4.5 }, nq: { n: 200, x: 5.5, y: 6 } };
  const short = { kalman: ps => `${ps.s}／${ps.l}`, envelope: ps => `${ps.n}／+${+ps.x}／−${+ps.y}`, kd: ps => `KD ${ps.n}` };
  // [市場, 策略名稱, 連結, 規則, 預設參數的鍵, 原始預設, A 的資料起點, [[指數代號, 顯示名稱], ...]]
  const ROWS = [
    ["tw", "Kalman 趨勢", "kalman.html", "kalman", "kalman", ST.kalman.DEF, "2003-01-02", [["TWRI", "報酬指數"], ["TWII", "加權指數"]]],
    ["tw", "均線包絡", "envelope.html", "envelope", "envelope", ST.envelope.DEF, "2003-01-02", [["TWRI", "報酬指數"], ["TWII", "加權指數"]]],
    ["tw", "月KD", "kd.html", "kd", "kd", ST.kd.DEF, "2003-01-02", [["TWRI", "報酬指數"], ["TWII", "加權指數"]]],
    ["us", "均線包絡", "envelope-us.html?g=sp", "envelope", "envelope-us:sp", US_DEF.sp, "1999-01-04", [["GSPC", "標普 500"], ["SP500TR", "標普 500 報酬"]]],
    ["us", "均線包絡", "envelope-us.html?g=nq", "envelope", "envelope-us:nq", US_DEF.nq, "1999-01-04", [["IXIC", "那斯達克綜合"], ["NDX", "那斯達克 100"]]],
  ];
  const D = {};
  const keys = ["TWRI", "TWII", "GSPC", "SP500TR", "IXIC", "NDX"];
  Promise.all([...keys.map(k => ET.load(k).then(s => D[k] = s)), ST.kd.loadHL()]).then(() => {
    render(SPage.loadDefaults(render));
  }).catch(e => { ["sig-tw", "sig-us"].forEach(id => document.getElementById(id).innerHTML = `<tbody><tr><td class="err">讀取失敗：${e.message}</td></tr></tbody>`); });
  const A = {};
  function series(k, from) { const key = k + from; if (!A[key]) { const s = D[k], i0 = ET.lowerBound(s.dates, from); A[key] = { dates: s.dates.slice(i0), px: Float64Array.from(s.adj.slice(i0)) }; } return A[key]; }
  const yr = d => `<span class="yr">${d.slice(0, 5)}</span>${d.slice(5)}`;   // 手機上省略年份
  function render(defs) {
    const out = { tw: "", us: "" };
    ROWS.forEach(([mk, name, href, rule, dk, def, from, sigs], gi) => {
      const my = defs[dk], ps = my ? my.ps : def;
      sigs.forEach(([k, label], si) => {
        const r = ST[rule].last(series(k, from), k, ps);
        const act = r ? `<b class="${r.act === "買進" ? "pos" : "neg"}">${r.act}</b>` : "—";
        out[mk] += `<tr class="${si === 0 && out[mk] ? "gap" : ""}">
          <td class="l">${si === 0 ? `<a href="${href}">${name}</a>` : ""}</td><td class="l">${label}</td>
          <td class="l mono pcol" title="${my ? "你指定的預設：" + my.name.replace(/"/g, "&quot;") : "原始預設"}">${short[rule](ps)}${my ? "<sup>*</sup>" : ""}</td>
          <td class="mono">${r ? yr(r.sig) : "—"}</td><td class="mono">${r ? (r.trade ? yr(r.trade) : "下個交易日") : "—"}</td><td>${act}</td></tr>`;
      });
    });
    const head = `<thead><tr><th class="l">策略</th><th class="l">訊號指數</th><th class="l pcol">參數</th><th>訊號日</th><th>成交日</th><th>動作</th></tr></thead>`;
    const anyMy = Object.keys(defs).length > 0;
    document.getElementById("sig-tw").innerHTML = head + "<tbody>" + out.tw + "</tbody>";
    document.getElementById("sig-us").innerHTML = head + "<tbody>" + out.us + "</tbody>";
    document.querySelectorAll("#sig .signote").forEach(x => x.remove());
    if (anyMy) document.querySelectorAll("#sig .card").forEach(c => c.insertAdjacentHTML("beforeend", `<p class="note signote" style="margin:6px 0 0"><sup>*</sup> 你在策略頁「我的參數」指定的預設；滑鼠移到參數上可以看名稱。</p>`));
  }
})();
</script>
<script>
(function(){
  const {fmt, TICKERS, ETF_LIST} = ET;
  const cls = ETUI.cls;

  // ---- 指數卡片 ----
  const RANGES = [["1年",1],["5年",5],["10年",10],["20年",20],["全部",0]];
  function indexCard(name){
    const box = document.getElementById("c-"+name), t = TICKERS[name];
    ET.load(name).then(s=>{
      const n = s.dates.length, last = s.close[n-1], prev = s.close[n-2];
      let ath = 0, athD = ""; for (let i=0;i<n;i++) if (s.close[i] > ath){ath = s.close[i]; athD = s.dates[i];}
      const dd = last/ath - 1;
      let range = 5, log = false;
      box.innerHTML = `<h3>${t.name}<span class="sub">${s.dates[n-1]} 收盤</span></h3>
        <div class="kpis">
          <div class="kpi"><small>收盤</small><b>${fmt.num(last,2)}</b></div>
          <div class="kpi"><small>今日</small><b class="${cls(last-prev)}">${fmt.spct(last/prev-1,2)}</b></div>
          <div class="kpi"><small>今年以來</small><b class="${cls(ET.periodChange({dates:s.dates,adj:s.close},0,"ytd"))}">${fmt.spct(ET.periodChange({dates:s.dates,adj:s.close},0,"ytd"))}</b></div>
          <div class="kpi"><small>距歷史高點${ETUI.info("歷史最高收盤 "+fmt.num(ath,2)+"（"+athD+"）。0% 代表正在創新高。")}</small><b class="${dd<0?"neg":""}">${fmt.pct(dd)}</b></div>
        </div>
        <div class="tools" style="margin:12px 0 4px">
          <div class="seg" data-r>${RANGES.map(([l,v])=>`<button type="button" data-v="${v}" class="${v===range?"on":""}">${l}</button>`).join("")}</div>
          <label class="chk" style="font-size:12.5px"><input type="checkbox" data-log> 對數座標${ETUI.info("對數座標下，同樣的漲跌幅（例如 +10%）在圖上高度一樣，適合看很長的期間。")}</label>
        </div>
        <div data-chart></div>
        <p class="note">${s.dates[0].slice(0,4)} 年起，共 ${fmt.num(n)} 個交易日。指數不含股息。</p>`;
      const draw = ()=>{
        const start = range ? ET.addYears(s.dates[n-1], -range) : s.dates[0];
        const a = ET.lowerBound(s.dates, start);
        ETChart.line(box.querySelector("[data-chart]"), {
          series:[{name:t.label, color:"var(--accent)", dates:s.dates.slice(a), values:Array.from(s.close.slice(a))}],
          log, height:260, yFmt:v=>fmt.num(v, v<100?1:0), aria:t.name+"走勢圖"
        });
      };
      box.querySelector("[data-r]").addEventListener("click", e=>{
        const b = e.target.closest("button"); if(!b) return;
        range = +b.dataset.v; box.querySelectorAll("[data-r] button").forEach(x=>x.classList.toggle("on", x===b));
        if (range === 0 || range === 20) { log = true; box.querySelector("[data-log]").checked = true; }
        draw();
      });
      box.querySelector("[data-log]").addEventListener("change", e=>{ log = e.target.checked; draw(); });
      draw();
    }).catch(e=>{ box.classList.add("err"); box.innerHTML = "讀取資料失敗："+e.message; });
  }
  indexCard("TWII"); indexCard("GSPC");

  // ---- 資料檢查 ----
  const TYPE = {missing:"缺資料", stale:"資料落後", gap:"資料中斷", jump:"跳格", ratio:"原始／還原價異常", rewrite:"歷史被改動"};
  function renderCheck(c){
    const box = document.getElementById("check");
    const row = (i, note) => `<tr><td>${i.ticker}</td><td>${TYPE[i.type]||i.type||""}</td><td>${i.date}</td><td class="wrap">${note!==undefined?note:i.detail}</td></tr>`;
    const tbl = (rows, head) => `<div class="tw"><table class="lt"><thead><tr><th>標的</th><th>類型</th><th>日期</th><th>${head}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    let h = `<h3>資料檢查${ETUI.info("每次自動更新時檢查：① 缺資料：同市場指數有交易、ETF 卻沒資料；② 跳格：ETF 單日漲跌和相關指數差太多（例如 0050 對照加權指數、00631L 對照 2 倍的 0050）；③ 原始／還原價異常：還原價÷原始價的比例在非除息日突然改變；④ 歷史被改動：和上次存的資料相比，過去的價格被改掉。發現新問題時，那一檔不更新、保留舊資料，並在 GitHub 開 Issue 寄 email 通知。")}<span class="sub">${c.checked} 檢查</span></h3>`;
    if (c.status === "problem") {
      h += `<p class="err" style="margin:0 0 8px">⚠ 發現 ${c.new.length} 個新問題，以下標的暫停更新、沿用上一次的資料：<b>${c.blocked.join("、")}</b></p>` + tbl(c.new.map(i=>row(i)).join(""), "說明");
    } else {
      h += `<p style="margin:0">✓ 沒有發現新問題。</p>`;
    }
    if (c.stale && c.stale.length) h += `<p class="note">資料落後（通常是資料源還沒更新，下次會補上）：${c.stale.map(i=>i.ticker+(i.type==="lag"?"（"+i.date+" 暫缺，這次先不更新）":"（到 "+i.date+"）")).join("、")}</p>`;
    if (c.fixed && c.fixed.length) h += `<details><summary>已修正的錯誤資料 ${c.fixed.length} 天（用相關指數當天的漲跌取代）</summary>${tbl(c.fixed.map(i=>row(Object.assign({type:"jump"},i), i.note)).join(""), "原因")}</details>`;
    if (c.ignored && c.ignored.length) h += `<details><summary>已確認為真實事件或無害的異常 ${c.ignored.length} 個</summary>${tbl(c.ignored.map(i=>row(i, i.note+"<br><span class=sub>"+i.detail+"</span>")).join(""), "原因")}</details>`;
    box.innerHTML = h;
  }
  if (window.ETCheck) renderCheck(window.ETCheck); else document.addEventListener("etcheck", e=>renderCheck(e.detail));

  // ---- ETF 卡片 ----
  const tiles = document.getElementById("tiles");
  const list = ETF_LIST.concat(["USDTWD"]);
  tiles.innerHTML = list.map(k=>`<a class="tile" id="t-${k}" ${k!=="USDTWD"?`href="backtest.html?t=${k}"`:""}><div class="loading">${k}</div></a>`).join("");
  list.forEach(k=>{
    const t = TICKERS[k], box = document.getElementById("t-"+k);
    ET.load(k).then(s=>{
      const n = s.dates.length;
      let ath = 0; for (let i=0;i<n;i++) if (s.adj[i] > ath) ath = s.adj[i];
      const day = s.adj[n-1]/s.adj[n-2]-1, ytd = ET.periodChange(s,0,"ytd"), y1 = ET.periodChange(s,0,1), y5 = ET.periodChange(s,0,5);
      const y5a = isFinite(y5) ? Math.pow(1+y5,1/5)-1 : NaN;
      const fx = t.kind === "fx";
      box.innerHTML = `<div class="hd"><span class="tk">${t.label}</span><span class="nm">${t.name}</span></div>
        <div class="hd"><span class="px">${fx?"":(t.ccy==="USD"?"$":"")}${fmt.num(s.close[n-1], fx?3:2)}</span><span class="chg ${cls(day)}">${fmt.spct(day,2)}</span></div>
        <div class="spark-h"></div>
        <div class="mini">
          <span>今年<b class="${cls(ytd)}">${fmt.spct(ytd)}</b></span>
          <span>近1年<b class="${cls(y1)}">${fmt.spct(y1)}</b></span>
          ${fx ? `<span>資料日<b>${s.dates[n-1].slice(5)}</b></span>`
               : `<span>${isFinite(y5a)?"5年年化":"距高點"}<b class="${isFinite(y5a)?cls(y5a):"neg"}">${isFinite(y5a)?fmt.spct(y5a):fmt.pct(s.adj[n-1]/ath-1)}</b></span>`}
        </div>`;
      const a = ET.lowerBound(s.dates, ET.addYears(s.dates[n-1], -1));
      ETChart.spark(box.querySelector(".spark-h"), s.dates.slice(a), Array.from(s.adj.slice(a)), t.color || "var(--accent)");
      box.title = `${t.name}｜${s.dates[n-1]} 收盤｜距歷史高點 ${fmt.pct(s.adj[n-1]/ath-1)}`;
    }).catch(()=>{ box.innerHTML = `<div class="hd"><span class="tk">${t.label}</span></div><span class="note">尚無資料</span>`; });
  });
})();
</script>
</body></html>
