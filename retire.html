<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>退休提領模擬｜ETF 工具箱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=1119b">
</head><body>
<div class="wrap">
<header id="top"></header>
<h1>退休提領模擬</h1>
<p class="sub" style="margin:-8px 0 0">假設退休時有一筆錢，每年年初領出生活費、其餘照配置投資。用歷史上每一個年份當退休起點各跑一次，看錢會不會在期限內用完。</p>
<div class="grid">
<form class="rail" id="f" onsubmit="return false">
  <h4>退休資產</h4>
  <label>退休時的總資產<input id="cap" type="number" min="1" step="100000" value="10000000"></label>
  <label>退休年數<input id="years" type="number" min="5" max="60" step="1" value="30"><span class="hint">錢要撐幾年</span></label>
  <h4>資產配置（每年年初再平衡）</h4>
  <label>股票<select id="stock"></select></label>
  <label>債券／現金<select id="bond"></select></label>
  <label><span>股票比例：<b id="wL">60%</b></span><input id="w" type="range" min="0" max="100" step="5" value="60"></label>
  <label class="chk"><input type="checkbox" id="ext"><span>用相關指數推估上市前的歷史<span id="extI"></span></span></label>
  <h4>提領方式</h4>
  <select id="method">
    <option value="rule4">4% 法則（第一年定額，之後照通膨調整）</option>
    <option value="pct">固定比例（每年領當年資產的固定 %）</option>
    <option value="guard">護欄法（市場好多領、差時少領）</option>
    <option value="fixed">固定金額（每年一樣，不調通膨）</option>
  </select>
  <label><span id="rateL">提領率（%）</span><input id="rate" type="number" min="0.5" max="15" step="0.1" value="4"></label>
  <p class="hint" id="methodH"></p>
  <h4>通膨</h4>
  <div class="seg" id="infl"><button type="button" data-v="cpi" class="on">美國 CPI</button><button type="button" data-v="fix">固定</button></div>
  <label id="inflFixL" hidden>每年通膨率（%）<input id="inflFix" type="number" min="0" max="15" step="0.1" value="2"></label>
  <p class="hint">台灣 CPI 資料準備中。結果中的「實質」金額，都已換算成退休第一年的購買力。</p>
</form>
<main id="out"><div class="card loading">讀取資料中…</div></main>
</div>
<footer>美股 S&P 500、美國 10 年公債、短期國庫券的年報酬來自紐約大學 Damodaran 教授公開的歷史資料（1928 年起，含息）；美國 CPI 來自明尼亞波利斯聯準銀行（年平均）；ETF 的年報酬由本站每日資料計算。未計稅費。本站僅供學習研究，不構成投資建議。</footer>
</div>
<script src="assets/core.js?v=1119b"></script>
<script src="assets/chart.js?v=1119b"></script>
<script src="assets/common.js?v=1119b"></script>
<script>
(function(){
  const {fmt, TICKERS} = ET;
  const info = ETUI.info, cls = ETUI.cls, $ = id => document.getElementById(id);

  // 可選的資產：kind=annual 用 Damodaran 年報酬；kind=etf 由每日資料算年報酬
  const STOCKS = [
    { id: "SP500", name: "美股 S&P 500（1928 年起）", kind: "annual", col: "sp500" },
    { id: "VT", name: "VT 全世界股票", kind: "etf" },
    { id: "QQQ", name: "QQQ 那斯達克100", kind: "etf" },
    { id: "0050", name: "0050 台灣50", kind: "etf" },
    { id: "006208", name: "006208 台灣50", kind: "etf" },
  ];
  const BONDS = [
    { id: "TBOND", name: "美國 10 年公債（1928 年起）", kind: "annual", col: "tbond10" },
    { id: "TBILL", name: "美國短期國庫券／現金（1928 年起）", kind: "annual", col: "tbill" },
    { id: "BND", name: "BND 美國整體債券", kind: "etf" },
  ];
  $("stock").innerHTML = STOCKS.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
  $("bond").innerHTML = BONDS.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
  $("extI").innerHTML = info("QQQ 上市前用那斯達克 100 指數推估到 1985 年、006208 用 0050 推估到 2003 年（準確度高）。推估的年份在圖表與表格中會標示。");
  const METHOD_HINT = {
    rule4: "第一年領「總資產 × 提領率」，之後每年照前一年的通膨調高金額，不管市場漲跌。最經典的做法，生活費穩定，但空頭時可能提早用完。",
    pct: "每年領「當年年初資產 × 提領率」。錢永遠不會用完，但市場差的時候生活費會跟著大減。",
    guard: "從「總資產 × 提領率」開始照通膨調整，但加上護欄：當年提領率比起始提領率高出 20% 以上時，提領金額減 10%；低於 20% 以上時，增加 10%。前一年虧損且提領率偏高時，當年不調通膨。",
    fixed: "每年領一樣的金額（第一年的「總資產 × 提領率」），不隨通膨調整。實質購買力會逐年下降。",
  };

  // ---------- 資料 ----------
  const D = {};
  function csv(path){ return fetch(path, {cache:"no-cache"}).then(r=>r.text()).then(t=>t.trim().split(/\r?\n/).slice(1).map(l=>l.split(","))); }
  Promise.all([
    csv("data/annual/us_returns.csv").then(r=>D.us = r),
    csv("data/annual/us_cpi.csv").then(r=>D.cpi = r),
    ...["VT","QQQ","0050","006208","BND","NDX"].map(k=>ET.load(k).then(s=>D[k]=s).catch(()=>null)),
  ]).then(run).catch(e=>{ $("out").innerHTML = `<div class="card err">資料讀取失敗：${e.message}</div>`; });

  // 某資產的年報酬：{year: {ret, est}}
  function annualOf(a){
    const out = {};
    if (a.kind === "annual") {
      const ci = {sp500:1, tbill:2, tbond10:3}[a.col];
      D.us.forEach(r=>out[+r[0]] = { ret: +r[ci], est: false });
      return out;
    }
    let s = D[a.id]; if (!s) return out;
    s = { dates: s.dates, adj: s.adj, estN: 0 };
    const spec = TICKERS[a.id].ext;
    if ($("ext").checked && spec && D[spec.base]) {
      const c = ET.calibrate(D[a.id], D[spec.base], spec.lev);
      s = ET.extend(D[a.id], D[spec.base], spec.lev, c.drag);
    }
    ET.annualReturns(s).forEach(x=>{ if (!x.partial) out[x.year] = { ret: x.ret, est: x.est }; });
    return out;
  }
  function inflationOf(){
    const out = {};
    if (st.infl === "fix") { const f = (+$("inflFix").value||0)/100; for (let y=1900;y<=2100;y++) out[y]=f; return out; }
    for (let i=1;i<D.cpi.length;i++) out[+D.cpi[i][0]] = +D.cpi[i][1] / +D.cpi[i-1][1] - 1;
    return out;
  }

  // ---------- 模擬一個起始年 ----------
  // 每年年初提領，剩下的照配置投資一年；回傳每年明細
  function simulate(startY, N, R, I, cap, method, rate){
    let bal = cap, w = cap * rate, realIdx = 1, prevRet = 0;
    const rows = []; let failYear = null;
    for (let k=0; k<N; k++){
      const y = startY + k;
      if (k > 0) {
        const infl = I[y-1];  // 上一年的通膨，用來調整今年的提領
        if (method === "rule4") w *= 1 + infl;
        else if (method === "guard") {
          const curRate = w * (1 + infl) / bal;
          if (!(prevRet < 0 && curRate > rate)) w *= 1 + infl;
          const r2 = w / bal;
          if (r2 > rate * 1.2) w *= 0.9; else if (r2 < rate * 0.8) w *= 1.1;
        }
        realIdx *= 1 + infl;
      }
      if (method === "pct") w = bal * rate;
      const take = Math.min(w, bal);
      bal -= take;
      const ret = R[y].ret;
      bal *= 1 + ret;
      rows.push({ y, take, takeReal: take / realIdx, bal, balReal: bal / (realIdx * (1 + (I[y]||0))), ret, est: R[y].est, short: take < w - 1e-6 });
      prevRet = ret;
      if (failYear === null && take < w - 1e-6) failYear = k + 1;  // 這一年領不到足額生活費
    }
    return { startY, rows, failYear, endReal: rows[rows.length-1].balReal };
  }

  // ---------- 狀態與控制 ----------
  const st = { infl: "cpi", sel: null };
  ["cap","years","stock","bond","w","ext","method","rate","inflFix"].forEach(id=>$(id).addEventListener(id==="w"?"input":"change", ()=>{ if (id!=="w") st.sel = null; run(); }));
  $("infl").addEventListener("click", e=>{ const b = e.target.closest("button"); if(!b) return;
    st.infl = b.dataset.v; $("infl").querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
    $("inflFixL").hidden = st.infl !== "fix"; run(); });

  function run(){
    if (!D.us) return;
    const N = Math.max(5, Math.min(60, +$("years").value || 30));
    const cap = Math.max(1, +$("cap").value || 0), wS = (+$("w").value)/100, rate = (+$("rate").value||4)/100;
    const method = $("method").value;
    $("wL").textContent = Math.round(wS*100) + "%";
    $("methodH").textContent = METHOD_HINT[method];
    const sA = STOCKS.find(x=>x.id===$("stock").value), bA = BONDS.find(x=>x.id===$("bond").value);
    const RS = annualOf(sA), RB = annualOf(bA), I = inflationOf();
    // 組合的年報酬（兩邊都有資料、也有通膨資料的年份）
    const R = {};
    Object.keys(RS).forEach(y=>{ y=+y; if (RB[y] && I[y] !== undefined) R[y] = { ret: wS*RS[y].ret + (1-wS)*RB[y].ret, est: RS[y].est || RB[y].est }; });
    const ys = Object.keys(R).map(Number).sort((a,b)=>a-b);
    // 年份必須連續
    let y0 = ys[0], y1 = ys[ys.length-1];
    for (let y = y1; y >= y0; y--) if (!R[y]) { y0 = y + 1; break; }
    const out = $("out");
    if (!ys.length || y1 - y0 + 1 < N) {
      out.innerHTML = `<div class="card">這個組合的資料是 ${ys.length? y0+"～"+y1+" 年，共 "+(y1-y0+1)+" 年":"空的"}，不夠跑 ${N} 年的退休期間。可以把退休年數調短，或改選 1928 年起的資產（S&P 500、美國公債）。</div>`;
      return;
    }
    const sims = [];
    for (let s = y0; s + N - 1 <= y1; s++) sims.push(simulate(s, N, R, I, cap, method, rate));
    // 尚未跑完的起始年（最近幾年）：只看到目前為止
    const partial = [];
    for (let s = Math.max(y0, y1 - N + 2); s <= y1; s++) partial.push(simulate(s, y1 - s + 1, R, I, cap, method, rate));
    render(sims, partial, { N, cap, rate, method, y0, y1, sA, bA, wS });
  }

  // ---------- 畫面 ----------
  const money = v => v >= 1e8 ? fmt.num(v/1e8, 2) + " 億" : v >= 1e4 ? fmt.num(v/1e4, 0) + " 萬" : fmt.num(v, 0);
  function render(sims, partial, P){
    const ok = sims.filter(s=>s.failYear===null), fail = sims.filter(s=>s.failYear!==null);
    const succ = ok.length / sims.length;
    const ends = sims.map(s=>s.endReal).sort((a,b)=>a-b);
    const med = ends[Math.floor(ends.length/2)];
    const worst = fail.length ? fail.reduce((a,b)=>a.failYear<b.failYear?a:b) : sims.reduce((a,b)=>a.endReal<b.endReal?a:b);
    const minTake = Math.min(...sims.map(s=>Math.min(...s.rows.map(r=>r.takeReal))));
    const anyEst = sims.some(s=>s.rows.some(r=>r.est));
    if (!st.sel || !sims.find(s=>s.startY===st.sel)) st.sel = worst.startY;
    const first = P.cap * P.rate;
    let h = `<section class="card"><h3>結果<span class="sub">${P.y0}～${P.y1} 年的資料，以每一年當退休起點跑 ${P.N} 年，共 ${sims.length} 種情境${anyEst?'<span class="esttag">含推估</span>':""}</span></h3>
      <div class="kpis">
        <div class="kpi"><small>成功率${info("在所有起始年中，錢撐滿 "+P.N+" 年沒有用完的比例。")}</small><b class="${succ>=0.95?"":succ>=0.8?"":"pos"}">${fmt.pct(succ,0)}</b></div>
        <div class="kpi"><small>第一年提領</small><b>${money(first)}</b></div>
        <div class="kpi"><small>最差情境</small><b>${worst.startY} 年退休</b><span class="sub">${worst.failYear?`第 ${worst.failYear} 年用完`:`期末剩 ${money(worst.endReal)}`}</span></div>
        <div class="kpi"><small>期末資產中位數（實質）${info("所有情境的期末資產，換算成退休第一年購買力後，排在中間的那個。")}</small><b>${money(med)}</b></div>
        <div class="kpi"><small>最少一年的提領（實質）${info("所有情境、所有年份中，提領金額換算成退休第一年購買力後的最低值。固定比例和護欄法的生活費會變動，要特別注意這個數字。")}</small><b>${money(minTake)}</b></div>
      </div>
      <p class="note">配置：${P.sA.name.replace(/（.*/,"")} ${Math.round(P.wS*100)}% ＋ ${P.bA.name.replace(/（.*/,"")} ${100-Math.round(P.wS*100)}%｜${$("method").selectedOptions[0].text.replace(/（.*/,"")}，提領率 ${fmt.pct(P.rate,1)}</p></section>`;
    h += `<section class="card"><h3>每個起始年的結果<span class="sub">期末資產（實質）。紅色＝期限內用完；點長條可看那一年的明細</span></h3><div id="ch-end"></div></section>
      <section class="card" id="detail"></section>
      <section class="card"><h3>所有情境<span class="sub">點一列看明細</span></h3><div class="tw" style="max-height:420px;overflow:auto"><table><thead><tr><th>退休起始年</th><th>結果</th><th>期末資產（實質）</th><th>最少一年提領（實質）</th><th>平均提領（實質）</th></tr></thead><tbody>
      ${sims.map(s=>{ const tk = s.rows.map(r=>r.takeReal); const e = s.rows.some(r=>r.est);
        return `<tr class="click" data-y="${s.startY}"><td>${s.startY}${e?'<span class="esttag">含推估</span>':""}</td><td class="${s.failYear?"pos":""}">${s.failYear?`第 ${s.failYear} 年用完`:"✓ 撐滿"}</td><td>${money(s.endReal)}</td><td>${money(Math.min(...tk))}</td><td>${money(tk.reduce((a,b)=>a+b,0)/tk.length)}</td></tr>`; }).join("")}
      </tbody></table></div>
      ${partial.length?`<p class="note">${partial[0].startY}～${partial[partial.length-1].startY} 年退休的情境還沒跑滿 ${P.N} 年，沒有計入成功率。</p>`:""}</section>`;
    $("out").innerHTML = h;
    // 期末資產長條：成功／用完分兩組顏色
    ETChart.bars($("ch-end"), {
      cats: sims.map(s=>s.startY), height: 240, yFmt: v=>money(v), ml: 72,
      series: [
        { name: "撐滿", color: "var(--accent)", values: sims.map(s=>s.failYear?null:s.endReal), est: sims.map(s=>s.rows.some(r=>r.est)) },
        { name: "用完", color: "var(--up)", values: sims.map(s=>s.failYear? Math.max(...sims.map(x=>x.endReal))*0.04 : null) },
      ],
      catNote: sims.map(s=>s.failYear?`第 ${s.failYear} 年用完`:""), single: true,
    });
    $("ch-end").querySelectorAll("svg rect").forEach((r,i)=>{ r.style.cursor="pointer"; r.addEventListener("click", ()=>{ st.sel = sims[i].startY; renderDetail(sims, P); }); });
    $("out").querySelectorAll("tr.click").forEach(tr=>tr.addEventListener("click", ()=>{ st.sel = +tr.dataset.y; renderDetail(sims, P); $("detail").scrollIntoView({behavior:"smooth", block:"start"}); }));
    renderDetail(sims, P);
  }

  function renderDetail(sims, P){
    const s = sims.find(x=>x.startY===st.sel), box = $("detail");
    box.innerHTML = `<h3>${s.startY} 年退休的過程<span class="sub">${s.failYear?`第 ${s.failYear} 年（${s.startY+s.failYear-1} 年）錢用完`:`撐滿 ${P.N} 年，期末剩 ${money(s.endReal)}（實質）`}</span></h3>
      <div class="two"><div><div class="sub" style="margin-bottom:4px">年底資產（實質）</div><div id="ch-bal"></div></div>
      <div><div class="sub" style="margin-bottom:4px">每年提領（實質）</div><div id="ch-take"></div></div></div>
      <details><summary>逐年明細</summary><div class="tw"><table><thead><tr><th>年份</th><th>提領（名目）</th><th>提領（實質）</th><th>當年組合報酬</th><th>年底資產（名目）</th><th>年底資產（實質）</th></tr></thead><tbody>
      ${s.rows.map(r=>`<tr><td>${r.y}${r.est?'<span class="esttag">推估</span>':""}</td><td>${money(r.take)}${r.short?' <span class="pos">不足</span>':""}</td><td>${money(r.takeReal)}</td><td class="${cls(r.ret)}">${fmt.spct(r.ret)}</td><td>${money(r.bal)}</td><td>${money(r.balReal)}</td></tr>`).join("")}
      </tbody></table></div></details>`;
    const estN = s.rows.filter(r=>r.est).length;
    ETChart.line($("ch-bal"), { series:[{ name:"資產", color:"var(--accent)", dates:s.rows.map(r=>r.y+"-12-31"), values:s.rows.map(r=>r.balReal), estN }],
      height: 220, zero: true, yFmt: v=>money(v), tipFmt: v=>money(v), ml: 64 });
    ETChart.bars($("ch-take"), { cats: s.rows.map(r=>r.y), height: 220, yFmt: v=>money(v), ml: 64,
      series:[{ name:"提領", color:"var(--s1)", values:s.rows.map(r=>r.takeReal), est:s.rows.map(r=>r.est) }] });
  }
})();
</script>
</body></html>
