<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETF 回測比較｜ETF 工具箱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div class="wrap">
<header id="top"></header>
<h1>ETF 回測比較</h1>
<div class="grid">
<form class="rail" id="f" onsubmit="return false">
  <h4>標的（最多 4 檔）</h4>
  <div class="picks" id="picks"></div>
  <h4>投入方式</h4>
  <div class="seg" id="mode"><button type="button" data-v="lump" class="on">單筆投入</button><button type="button" data-v="dca">定期定額</button></div>
  <label><span id="amtL">投入金額</span><input id="amt" type="number" min="1" step="1000" value="100000"><span class="hint" id="amtH"></span></label>
  <h4>期間</h4>
  <div class="row2"><label>起<input id="start" type="date"></label><label>迄<input id="end" type="date"></label></div>
  <div class="quick"><button type="button" data-q="max">最長共同期間</button><button type="button" data-q="10">近 10 年</button><button type="button" data-q="5">近 5 年</button></div>
  <p class="hint" id="rangeH"></p>
  <div id="ccyBox">
    <h4>美股計價幣別</h4>
    <div class="seg" id="ccy"><button type="button" data-v="USD" class="on">美金</button><button type="button" data-v="TWD">台幣</button></div>
    <p class="hint">台幣：以每天的美元兌台幣匯率換算，報酬會包含匯率漲跌。</p>
  </div>
  <label class="chk"><input type="checkbox" id="ext"><span>用相關指數推估上市前的歷史<span id="extI"></span></span></label>
  <p class="hint" id="extH"></p>
</form>
<main id="out"><div class="card loading">讀取資料中…</div></main>
</div>
<footer>報酬一律以還原股價（含息再投入）計算，未計手續費與稅。定期定額為每月第一個交易日買進、可買零股。本站僅供學習研究，不構成投資建議。</footer>
</div>
<script src="assets/core.js"></script>
<script src="assets/chart.js"></script>
<script src="assets/common.js"></script>
<script>
(function(){
  const {fmt, TICKERS, ETF_LIST} = ET;
  const info = ETUI.info, cls = ETUI.cls;
  const $ = id => document.getElementById(id);

  // ---------- 狀態 ----------
  const qs = new URLSearchParams(location.search);
  const st = {
    picks: qs.get("t") ? [qs.get("t")].filter(t=>ETF_LIST.includes(t)) : ["0050","VOO"],
    mode: "lump", ccy: "USD", ext: false, log: true, rollN: 5, start: null, end: null,
  };
  if (qs.get("t") && st.picks.length) { const other = TICKERS[st.picks[0]].ccy === "USD" ? "0050" : "VOO"; st.picks.push(other); }

  $("picks").innerHTML = ETF_LIST.map(k=>`<label class="pick"><input type="checkbox" value="${k}" ${st.picks.includes(k)?"checked":""}><i style="background:var(--s${TICKERS[k].color})"></i>${k}<small>${TICKERS[k].ccy==="USD"?"美":"台"}</small></label>`).join("");
  $("extI").innerHTML = info("有些 ETF 上市比較晚。勾選後，用追蹤相同指數的標的把歷史往前延伸：006208 用 0050、00631L 用 0050 的 2 倍、QLD 用 QQQ 的 2 倍、VOO 用 S&P 500 含息報酬指數。每年的成本差異，用兩者都有資料的重疊期間自動校準。推估的部分在圖上以虛線、表格中以灰色顯示。VT、QQQ、BND、0050 沒有延伸。");

  // ---------- 資料 ----------
  const raw = {};
  const need = ETF_LIST.concat(["SP500TR","USDTWD"]);
  Promise.all(need.map(k=>ET.load(k).then(s=>raw[k]=s).catch(()=>null))).then(()=>{
    if (!raw.USDTWD) $("ccy").querySelector('[data-v="TWD"]').disabled = true;
    // 每檔標示資料從哪一年開始
    $("picks").querySelectorAll(".pick").forEach(lb=>{ const k = lb.querySelector("input").value;
      if (raw[k]) lb.querySelector("small").textContent += " " + raw[k].dates[0].slice(0,4); });
    run();
  });

  // 依目前設定做出各檔的序列（延伸 → 換幣別）
  const calib = {};
  function series(k){
    let s = raw[k]; if (!s) return null;
    s = { dates: s.dates, adj: s.adj, estN: 0 };
    const spec = TICKERS[k].ext;
    if (st.ext && spec && raw[spec.base]) {
      if (!calib[k]) calib[k] = ET.calibrate(raw[k], raw[spec.base], spec.lev);
      s = ET.extend(raw[k], raw[spec.base], spec.lev, calib[k].drag);
    }
    if (TICKERS[k].ccy === "USD" && st.ccy === "TWD" && raw.USDTWD) s = ET.toTWD(s, raw.USDTWD);
    return s;
  }
  const ccyOf = k => TICKERS[k].ccy === "USD" && st.ccy === "USD" ? "USD" : "TWD";

  // ---------- 控制項 ----------
  $("picks").addEventListener("change", e=>{
    const boxes = [...$("picks").querySelectorAll("input")];
    let on = boxes.filter(b=>b.checked).map(b=>b.value);
    if (on.length > 4) { e.target.checked = false; on = on.filter(v=>v!==e.target.value); alertNote("最多同時比較 4 檔"); }
    // 保留勾選的先後順序
    st.picks = st.picks.filter(k=>on.includes(k)).concat(on.filter(k=>!st.picks.includes(k)));
    run();
  });
  function segBind(id, key){
    $(id).addEventListener("click", e=>{ const b = e.target.closest("button"); if(!b||b.disabled) return;
      st[key] = b.dataset.v; $(id).querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
      if (key === "mode") { $("amt").value = st.mode === "lump" ? 100000 : 10000; $("amt").step = st.mode === "lump" ? 10000 : 1000; }
      run(); });
  }
  segBind("mode","mode"); segBind("ccy","ccy");
  $("ext").addEventListener("change", e=>{ st.ext = e.target.checked; st.start = null; run(); });
  $("amt").addEventListener("change", run);
  $("start").addEventListener("change", e=>{ st.start = e.target.value || null; run(); });
  $("end").addEventListener("change", e=>{ st.end = e.target.value || null; run(); });
  document.querySelector(".quick").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    st.start = b.dataset.q === "max" ? null : ET.addYears(st.end || today(), -+b.dataset.q);
    run();
  });
  let lastEnd = "";
  const today = () => lastEnd;
  let noteTimer;
  function alertNote(t){ const h = $("rangeH"); h.textContent = t; clearTimeout(noteTimer); noteTimer = setTimeout(()=>run(), 1800); }

  // ---------- 主計算 ----------
  function run(){
    const picks = st.picks.filter(k=>raw[k]);
    $("ccyBox").hidden = !picks.some(k=>TICKERS[k].ccy==="USD");
    const out = $("out");
    if (!picks.length) { out.innerHTML = '<div class="card">請在左邊勾選至少一檔 ETF。</div>'; return; }
    const S = {}; picks.forEach(k=>S[k] = series(k));
    const common0 = picks.map(k=>S[k].dates[0]).sort().pop();
    const common1 = picks.map(k=>S[k].dates[S[k].dates.length-1]).sort()[0];
    lastEnd = common1;
    let start = st.start && st.start > common0 ? st.start : common0;
    let end = st.end && st.end < common1 ? st.end : common1;
    if (start >= end) { start = common0; end = common1; }
    $("start").value = start; $("end").value = end; $("start").min = common0; $("end").max = common1;
    const latest = picks.filter(k=>S[k].dates[0] === common0).map(k=>k).join("、");
    $("rangeH").textContent = `可用期間 ${common0} ～ ${common1}` + (picks.length > 1 && picks.some(k=>S[k].dates[0] < common0) ? `。多檔一起比較時，從資料最晚開始的 ${latest} 算起；要看單一檔的完整歷史，只勾那一檔即可` : "");
    const extKs = picks.filter(k=>st.ext && TICKERS[k].ext && calib[k]);
    $("extH").innerHTML = extKs.map(k=>`${k}：${TICKERS[k].ext.note}，校準年成本 ${fmt.pct(calib[k].drag,2)}`).join("<br>");

    const amt = Math.max(1, +$("amt").value || 0);
    const ccys = [...new Set(picks.map(ccyOf))];
    $("amtL").textContent = st.mode === "lump" ? "投入金額" : "每月投入金額";
    $("amtH").textContent = ccys.length > 1 ? "台股以台幣計、美股以美金計（同一個數字）。比較時請看報酬率。" : (ccys[0] === "USD" ? "以美金計" : "以台幣計");

    const R = picks.map(k=>{
      const s = ET.slice(S[k], start, end);
      const res = st.mode === "lump" ? ET.lumpSum(s, amt) : ET.dca(s, amt);
      return { k, s, res, ccy: ccyOf(k), color: TICKERS[k].color, ann: ET.annualReturns(s), dd: ET.drawdownSeries(s.adj) };
    });
    render(R, start, end, ccys);
  }

  // ---------- 畫面 ----------
  function render(R, start, end, ccys){
    const lump = st.mode === "lump";
    const yrs = ET.years(start, end);
    const anyEst = R.some(r=>r.s.estN>0);
    const estTxt = r => r.s.estN > 0 ? `<br><span class="est">${r.s.dates[0]}～${r.s.dates[r.s.estN-1]} 為推估</span>` : "";
    const ddRange = r => { const m = r.res.mdd; return `${r.s.dates[m.from]} → ${r.s.dates[m.to]}`; };
    const bestWorst = r => { const full = r.ann.filter(a=>!a.partial); if (!full.length) return ["—","—"];
      const b = full.reduce((a,c)=>c.ret>a.ret?c:a), w = full.reduce((a,c)=>c.ret<a.ret?c:a);
      return [`${fmt.spct(b.ret)}（${b.year}）`, `${fmt.spct(w.ret)}（${w.year}）`]; };

    let html = `<section class="card"><h3>結果<span class="sub">${start} ～ ${end}，約 ${yrs.toFixed(1)} 年｜${lump?"單筆投入":"定期定額，每月第一個交易日買進"}</span></h3>
      <div class="tw"><table><thead><tr><th>標的</th>
      ${lump ? `<th>投入</th><th>期末資產</th><th>總報酬</th><th>年化報酬${info("把總報酬換算成「平均每年」的複利報酬率。")}</th>`
             : `<th>總投入</th><th>期末資產</th><th>總報酬</th><th>年化報酬${info("定期定額每筆錢投入的時間不同，這裡用內部報酬率（IRR）換算成平均每年的報酬，可以跟單筆的年化報酬互相比較。")}</th><th>最大帳面虧損${info("期間內，資產市值比累計投入的本金少最多的時候，少了幾 %。")}</th>`}
      <th>最大回撤${info("標的價格從前高跌到最低點，最多跌了幾 %。代表最壞時候要承受的帳面跌幅。")}</th>
      <th>年化波動${info("每日漲跌幅的標準差換算成一年。數字越大，代表上上下下越劇烈。股票型大約 15%～25%，正2 大約 35%～50%。")}</th>
      <th>最好／最差年度</th></tr></thead><tbody>`;
    for (const r of R) {
      const x = r.res, [bw, ww] = bestWorst(r);
      html += `<tr><td><span class="sw" style="background:var(--s${r.color})"></span><b>${r.k}</b> <span class="sub">${r.ccy==="USD"?"美金":"台幣"}</span>${estTxt(r)}</td>
        <td>${fmt.money(x.invested, r.ccy)}</td><td>${fmt.money(x.final, r.ccy)}</td>
        <td class="${cls(x.totalRet)}">${fmt.spct(x.totalRet)}</td>
        <td class="${cls(lump?x.cagr:x.irr)}"><b>${fmt.spct(lump?x.cagr:x.irr,2)}</b></td>
        ${lump ? "" : `<td class="${x.worstLoss<0?"neg":""}">${fmt.pct(x.worstLoss)}<br><span class="sub">${x.worstAt}</span></td>`}
        <td class="neg" title="${ddRange(r)}">${fmt.pct(x.mdd.mdd)}<br><span class="sub">${r.s.dates[x.mdd.to]}</span></td>
        <td>${fmt.pct(x.vol)}</td><td>${bw}<br>${ww}</td></tr>`;
    }
    html += `</tbody></table></div>${ccys.length>1?'<p class="note">台股以台幣、美股以美金計，期末金額不能直接相比，請看報酬率。要用同一種幣別比較，可把「美股計價幣別」切成台幣。</p>':""}</section>`;

    html += `<section class="card"><h3>${ccys.length>1 ? "成長倍數" : "資產變化"}<span class="sub">${ccys.length>1 ? "每投入 1 元變成幾元（幣別不同，所以用倍數比較）" : (ccys[0]==="USD"?"美金":"台幣")}</span></h3>
      <div class="tools" style="margin-bottom:6px"><label class="chk" style="font-size:12.5px"><input type="checkbox" id="logc" ${st.log?"checked":""}> 對數座標</label></div>
      <div id="ch-value"></div></section>
      <section class="card"><h3>回撤<span class="sub">每天距離前高跌了多少（標的本身）</span></h3><div id="ch-dd"></div></section>
      <section class="card"><h3>每年報酬<span class="sub">日曆年度，含息。頭尾不滿一整年的年度會標示</span></h3><div id="ch-ann"></div></section>
      <section class="card" id="rollCard"></section>`;
    $("out").innerHTML = html;

    // 資產 / 倍數
    const multi = ccys.length > 1;
    ETChart.line($("ch-value"), {
      series: R.map(r=>({ name: r.k, color: r.color, dates: r.s.dates, estN: r.s.estN,
        values: Array.from(multi ? r.res.value.map((v,i)=> lump ? v/r.res.invested : v/r.res.investedSeries[i]) : r.res.value) })),
      log: st.log, height: 320,
      yFmt: multi ? v=>v.toFixed(v<10?1:0)+"x" : v=>shortMoney(v, ccys[0]),
      tipFmt: multi ? v=>v.toFixed(2)+" 倍" : v=>fmt.money(v, ccys[0]),
    });
    $("logc").addEventListener("change", e=>{ st.log = e.target.checked; render(R, start, end, ccys); });
    // 回撤
    ETChart.line($("ch-dd"), {
      series: R.map(r=>({ name: r.k, color: r.color, dates: r.s.dates, estN: r.s.estN, values: Array.from(r.dd) })),
      area: R.length === 1, zero: true, height: 220, yFmt: v=>fmt.pct(v,0), tipFmt: v=>fmt.pct(v,1), noLabels: true,
    });
    // 每年報酬
    const yearsSet = [...new Set(R.flatMap(r=>r.ann.map(a=>a.year)))].sort();
    ETChart.bars($("ch-ann"), {
      cats: yearsSet, height: 260, yFmt: v=>fmt.pct(v,0),
      series: R.map(r=>{ const m = {}; r.ann.forEach(a=>m[a.year]=a); return {
        name: r.k, color: r.color, values: yearsSet.map(y=>m[y]?m[y].ret:null),
        est: yearsSet.map(y=>m[y]&&m[y].est), partial: yearsSet.map(y=>m[y]&&m[y].partial) }; }),
    });
    renderRolling(R, yrs);
  }

  function renderRolling(R, yrs){
    const box = $("rollCard");
    const opts = [1,3,5,10,15].filter(n=>n < yrs);
    if (!opts.length) { box.innerHTML = '<h3>滾動報酬</h3><p class="note">期間太短，至少要超過 1 年。</p>'; return; }
    if (!opts.includes(st.rollN)) st.rollN = opts.includes(5) ? 5 : opts[opts.length-1];
    const N = st.rollN;
    const RR = R.map(r=>({ r, ro: ET.rolling(r.s, N) }));
    let h = `<h3>滾動報酬${info("假設你在期間內「任何一個月」開始單筆買進，持有 N 年後賣出，年化報酬會是多少。把所有起點的結果攤開來看，可以知道：持有 N 年賠錢的機率有多高、最差和最好的情況。")}<span class="sub">期間內每個月都當一次起點，單筆買進持有 ${N} 年</span></h3>
      <div class="tools" style="margin-bottom:10px">持有年數 <div class="seg" id="rollSeg">${opts.map(n=>`<button type="button" data-v="${n}" class="${n===N?"on":""}">${n} 年</button>`).join("")}</div></div>
      <div class="tw"><table><thead><tr><th>標的</th><th>起點數</th><th>賺錢機率</th><th>最差</th><th>中位數</th><th>最好</th><th>一半落在${info("把所有起點的年化報酬由低到高排，中間 50%（第 25～75 百分位）的範圍。")}</th></tr></thead><tbody>`;
    for (const {r, ro} of RR) {
      if (!ro.n) { h += `<tr><td>${r.k}</td><td colspan="6" class="sub">期間不足 ${N} 年</td></tr>`; continue; }
      h += `<tr><td><span class="sw" style="background:var(--s${r.color})"></span><b>${r.k}</b></td><td>${ro.n}</td>
        <td><b>${fmt.pct(ro.posRate,0)}</b></td>
        <td class="${cls(ro.min.ret)}">${fmt.spct(ro.min.ret)}<br><span class="sub">${ro.min.date.slice(0,7)} 起</span></td>
        <td class="${cls(ro.median)}">${fmt.spct(ro.median)}</td>
        <td class="${cls(ro.max.ret)}">${fmt.spct(ro.max.ret)}<br><span class="sub">${ro.max.date.slice(0,7)} 起</span></td>
        <td>${fmt.spct(ro.p25)} ～ ${fmt.spct(ro.p75)}</td></tr>`;
    }
    h += `</tbody></table></div><div id="ch-roll" style="margin-top:14px"></div><p class="note">橫軸是「買進的月份」，縱軸是持有 ${N} 年的年化報酬。低於 0 代表那個月買進、${N} 年後還是賠錢。</p>`;
    box.innerHTML = h;
    ETChart.line($("ch-roll"), {
      series: RR.filter(x=>x.ro.n).map(({r,ro})=>({ name: r.k, color: r.color, dates: ro.pts.map(p=>p.date),
        values: ro.pts.map(p=>p.ret), estN: ro.pts.filter(p=>p.est).length })),
      zero: true, height: 260, yFmt: v=>fmt.pct(v,0),
      tipFmt: (v,s,i)=>fmt.spct(v,1), noLabels: false,
    });
    $("rollSeg").addEventListener("click", e=>{ const b = e.target.closest("button"); if(!b) return; st.rollN = +b.dataset.v; renderRolling(R, yrs); });
  }

  function shortMoney(v, ccy){
    const p = ccy === "USD" ? "$" : "";
    if (ccy !== "USD") { if (v >= 1e8) return (v/1e8).toFixed(v>=1e9?0:1)+"億"; if (v >= 1e4) return (v/1e4).toFixed(v>=1e5?0:1)+"萬"; return Math.round(v)+""; }
    if (v >= 1e6) return p+(v/1e6).toFixed(v>=1e7?0:1)+"M"; if (v >= 1e3) return p+(v/1e3).toFixed(v>=1e4?0:1)+"K"; return p+Math.round(v);
  }
})();
</script>
</body></html>
