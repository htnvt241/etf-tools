<script>
(async()=>{
// 股價：讀網站每天自動更新的資料（0050 與 00631L 的還原收盤價）
const toRows=s=>Array.from(s.dates,(d,i)=>[d,Math.round(s.adj[i]*10000)/10000]);
let A0050,BASE631;
try{A0050=toRows(await ET.load('0050'));BASE631=toRows(await ET.load('00631L')).filter(r=>r[0]>='2014-10-31');}
catch(e){document.querySelector('.wrap').insertAdjacentHTML('beforeend','<div class="card alert">股價資料讀取失敗，請重新整理網頁。</div>');return}
let R631=BASE631;
let LAST=BASE631[BASE631.length-1][0];
function dayDiff(a,b){const f=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));return (f(b)-f(a))/864e5;}
function simulate(data,p){
  // data: [[YYYY-MM-DD, price],...] ascending
  let i0=data.findIndex(r=>r[0]>=p.start); if(i0<0)return null;
  let i1=-1; for(let i=data.length-1;i>=0;i--){if(data[i][0]<=p.end){i1=i;break;}}
  if(i1<=i0)return null;
  const fee=p.fee, tax=p.tax, tgt=p.target, hi=tgt*(1+p.up), lo=tgt*(1-p.dn);
  const rebal=p.rebalance!==false;
  const trades=[], curve=[]; let withdrawn=0, depleted=null, shortCount=0;
  let price=data[i0][1];
  let shares=Math.floor(p.capital*p.pct/(price*(1+fee)));
  let cash=p.capital-shares*price*(1+fee);
  const T0=()=>cash+shares*price;
  trades.push({date:data[i0][0],est:data[i0][2]||0,pos:shares,type:'初始買進',price,shares,amount:shares*price,eBefore:0,eAfter:2*shares*price/T0(),cash,total:T0()});
  let peak=T0(),mdd=0,minCash=cash,minE=1e9,maxE=0;
  let lastT=T0(),minCashDate=data[i0][0],mddDate=data[i0][0];
  if(!p.light)curve.push([data[i0][0],T0(),2*shares*price/T0(),cash,price,data[i0][2]||0]);
  for(let i=i0+1;i<=i1;i++){
    const d=data[i][0]; price=data[i][1];
    const gap=dayDiff(data[i-1][0],d);
    if(cash>0&&p.cashRate)cash*=1+p.cashRate*gap/365;
    if(d.slice(0,7)!==data[i-1][0].slice(0,7)&&p.withdraw>0){
      cash-=p.withdraw; withdrawn+=p.withdraw;
      if(cash<0){
        if(!depleted)depleted=d;
        const n=Math.min(shares,Math.ceil(-cash/(price*(1-fee-tax))));
        if(n>0){const eb=2*shares*price/(cash+shares*price);
          shares-=n; cash+=n*price*(1-fee-tax);
          trades.push({date:d,est:data[i][2]||0,pos:shares,type:'強制賣出(生活費)',price,shares:-n,amount:-n*price,eBefore:eb,eAfter:shares>0?2*shares*price/Math.max(T0(),1):0,cash,total:T0()});}
      }
    }
    let T=cash+shares*price;
    let E=T>0?2*shares*price/T:0;
    if(rebal&&T>0){
      const Vt=tgt*T/2;
      if(E>=hi){
        const n=Math.floor((shares*price-Vt)/price);
        if(n>0){shares-=n; cash+=n*price*(1-fee-tax);
          const T2=T0();
          trades.push({date:d,est:data[i][2]||0,pos:shares,type:'減碼',price,shares:-n,amount:-n*price,eBefore:E,eAfter:2*shares*price/T2,cash,total:T2});}
      }else if(E<=lo){
        const need=Math.floor((Vt-shares*price)/price);
        const afford=Math.floor(Math.max(cash,0)/(price*(1+fee)));
        const n=Math.min(need,afford);
        if(need>afford){shortCount++; if(!depleted)depleted=d;}
        if(n>0){shares+=n; cash-=n*price*(1+fee);
          const T2=T0();
          trades.push({date:d,est:data[i][2]||0,pos:shares,type:need>afford?'加碼(現金不足)':'加碼',price,shares:n,amount:n*price,eBefore:E,eAfter:2*shares*price/T2,cash,total:T2});}
      }
    }
    T=cash+shares*price; E=T>0?2*shares*price/T:0;
    peak=Math.max(peak,T); if(T/peak-1<mdd){mdd=T/peak-1;mddDate=d;}
    if(cash<minCash){minCash=cash;minCashDate=d;}  minE=Math.min(minE,E); maxE=Math.max(maxE,E);
    lastT=T; if(!p.light)curve.push([d,T,E,cash,price,data[i][2]||0]);
  }
  const days=dayDiff(data[i0][0],data[i1][0]);
  const final=lastT;
  const adj=final+withdrawn;
  return {trades,curve,final,withdrawn,days,
    total:final/p.capital-1,
    cagr:days>0&&adj>0?Math.pow(adj/p.capital,365.25/days)-1:NaN,
    mdd,mddDate,minCash,minCashDate,minE,maxE,depleted,shortCount,
    startDate:data[i0][0],endDate:data[i1][0],hi,lo,tgt,
    buys:trades.filter(t=>t.type.startsWith('加碼')).length,
    sells:trades.filter(t=>t.type==='減碼').length};
}

const $=id=>document.getElementById(id);
const pct=(x,d=1)=>isFinite(x)?(x*100).toFixed(d)+'%':'—';
const wan=x=>{const v=Math.round(x/1e4);return (v===0?0:v).toLocaleString('en-US')+' 萬'};
const swan=x=>(x>0?'+':'')+(x/1e4).toLocaleString('en-US',{maximumFractionDigits:1})+' 萬';
const num=(x,d=2)=>x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const priceFmt=p=>num(p,p<1?3:2);
const REAL_FROM=BASE631[0][0];
let DATA=[],STATE=null,view=null;

function buildPrices(cost){
  let k=-1;for(let i=0;i<A0050.length;i++){if(A0050[i][0]<=REAL_FROM)k=i;else break}
  const pre=[];let p=R631[0][1];
  for(let i=k;i>0;i--){const r=A0050[i][1]/A0050[i-1][1]-1;p/=(1+2*r-cost/245);pre.push([A0050[i-1][0],p,1])}
  pre.reverse();
  return pre.concat(R631.map(r=>[r[0],r[1],0]));
}
const FIRST=A0050[0][0];
$('start').min=FIRST;$('start').max=LAST;$('end').min=FIRST;$('end').max=LAST;
$('start').value='2014-12-31';$('end').value=LAST;
let targetTouched=false;
$('target').addEventListener('input',()=>targetTouched=true);
$('pct').addEventListener('input',()=>{const v=parseFloat($('pct').value)||0;$('pcthint').textContent=`${v}% ＝ 初始曝險 ${(2*v/100).toFixed(2)} 倍`;if(!targetTouched)$('target').value=(2*v/100).toFixed(2)});
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{$('start').value=b.dataset.s;$('end').value=LAST;runCur()});  // 迄日一律回到最新一天

// info popovers (hover or click)
const tip=$('tip');let pinned=null;
function showTip(b){tip.textContent=b.dataset.tip;tip.hidden=false;const r=b.getBoundingClientRect(),w=tip.offsetWidth;
  tip.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';tip.style.top=(r.bottom+6)+'px'}
document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('.info');if(b&&!pinned)showTip(b)});
document.addEventListener('mouseout',e=>{const b=e.target.closest&&e.target.closest('.info');if(b&&!pinned)tip.hidden=true});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.info');
  if(b){e.preventDefault();if(pinned===b){pinned=null;tip.hidden=true}else{pinned=b;showTip(b)}}
  else if(pinned){pinned=null;tip.hidden=true}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){pinned=null;tip.hidden=true}});

function params(){
  const v=id=>parseFloat($(id).value);
  return {capital:v('capital')*1e4,pct:v('pct')/100,withdraw:(v('withdraw')||0)*1e4,start:$('start').value,end:$('end').value,
    target:v('target'),up:v('up')/100,dn:v('dn')/100,fee:0.001425*v('disc'),tax:v('tax')/100,cashRate:(v('cr')||0)/100};
}

/* ---------- interactive chart ---------- */
function chart(el,c){
  const W=Math.max(320,el.clientWidth),H=c.h,m={l:62,r:16,t:12,b:26},pw=W-m.l-m.r,ph=H-m.t-m.b;
  const a=c.a,b=c.b,span=Math.max(1,b-a);
  const X=i=>m.l+(i-a)/span*pw;
  let vals=[];for(const s of c.series)for(let i=a;i<=b;i++)vals.push(s.v[i]);
  vals=vals.concat(c.extra||[]).filter(y=>isFinite(y)&&(!c.log||y>0));
  let lo=Math.min(...vals),hi=Math.max(...vals);
  const f=c.log?Math.log:(x=>x);
  if(!c.log){const pad=(hi-lo)*.06||1;lo-=pad;hi+=pad}
  const Y=y=>m.t+ph-(f(Math.max(y,c.log?lo:-1e18))-f(lo))/((f(hi)-f(lo))||1)*ph;
  let g='';
  const ticks=[];
  if(c.log){let p=Math.pow(10,Math.floor(Math.log10(lo)));for(;p<=hi*1.001;p*=10)for(const k of[1,2,5]){const v=p*k;if(v>=lo&&v<=hi)ticks.push(v)}}
  if(c.log&&ticks.length<3){ticks.length=0;for(let i=0;i<=4;i++)ticks.push(Math.exp(Math.log(lo)+(Math.log(hi)-Math.log(lo))*i/4))}
  else if(!c.log)for(let i=0;i<=5;i++)ticks.push(lo+(hi-lo)*i/5);
  for(const v of ticks){const y=Y(v);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${c.fmtY(v)}</text>`}
  // x ticks: years, or months when zoomed in
  const D=c.dates,yearsSpan=(Date.parse(D[b])-Date.parse(D[a]))/3.15e10;
  const unit=yearsSpan<2.2?7:4;const seen=new Set(),tk=[];
  for(let i=a;i<=b;i++){const key=D[i].slice(0,unit);if(!seen.has(key)){seen.add(key);tk.push([i,key])}}
  const step=Math.max(1,Math.ceil(tk.length/(W<600?4:10)));
  tk.forEach((t,j)=>{if(j%step===0&&j>0||j===0&&tk.length<=2){const x=X(t[0]);if(x>m.l+14&&x<W-m.r-14)g+=`<text x="${x}" y="${H-7}" text-anchor="middle">${t[1]}</text>`}});
  // estimated region
  const e=c.estEnd;
  if(e>a){const x1=X(a),x2=X(Math.min(e,b));g+=`<rect x="${x1}" y="${m.t}" width="${Math.max(0,x2-x1)}" height="${ph}" fill="var(--estbg)"/>`;
    if(x2-x1>150)g+=`<text class="estl" x="${x1+6}" y="${m.t+12}">推估區（0050 回推）</text>`}
  for(const h of c.hlines||[]){const y=Y(h.v);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="${h.c}" stroke-dasharray="${h.dash||'4 3'}"/><text x="${W-m.r-2}" y="${y-3}" text-anchor="end" style="fill:${h.c}">${h.label}</text>`}
  const poly=(s,i0,i1,dash)=>{if(i1<i0)return'';const k=Math.max(1,Math.floor((i1-i0)/800));let p='';
    for(let i=i0;i<=i1;i+=k)p+=`${X(i).toFixed(1)},${Y(s.v[i]).toFixed(1)} `;
    if((i1-i0)%k)p+=`${X(i1).toFixed(1)},${Y(s.v[i1]).toFixed(1)}`;
    return `<polyline points="${p}" fill="none" stroke="${s.c}" stroke-width="${s.w||1.6}" stroke-linejoin="round"${dash?' stroke-dasharray="5 3"':''}/>`};
  for(const s of c.series){g+=poly(s,a,Math.min(e,b),true)+poly(s,Math.max(a,e),b,false)}
  for(const t of c.marks||[]){if(t.i<a||t.i>b)continue;const x=X(t.i);
    g+=`<line x1="${x}" x2="${x}" y1="${Y(t.y0)}" y2="${Y(t.y1)}" stroke="${t.c}" stroke-width="2"/><circle cx="${x}" cy="${Y(t.y1)}" r="3" fill="${t.c}"/>`}
  g+=`<line id="xh" y1="${m.t}" y2="${m.t+ph}" stroke="var(--mute)" stroke-dasharray="3 3" visibility="hidden"/>`;
  c.series.forEach((s,k)=>g+=`<circle id="hd${k}" r="4" fill="${s.c}" stroke="var(--panel)" stroke-width="1.5" visibility="hidden"/>`);
  g+=`<rect id="sel" y="${m.t}" height="${ph}" fill="var(--accent)" opacity=".15" visibility="hidden"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.label}">${g}</svg><div class="ct" hidden></div>`;
  const svg=el.querySelector('svg'),ct=el.querySelector('.ct'),xh=svg.querySelector('#xh'),sel=svg.querySelector('#sel');
  const hd=c.series.map((_,k)=>svg.querySelector('#hd'+k));
  const pos=ev=>{const r=svg.getBoundingClientRect();const x=Math.max(m.l,Math.min(W-m.r,(ev.clientX-r.left)/r.width*W));
    return{x,i:Math.max(a,Math.min(b,Math.round(a+(x-m.l)/pw*span))),r}};
  let drag=null;
  const hide=()=>{xh.setAttribute('visibility','hidden');hd.forEach(h=>h.setAttribute('visibility','hidden'));ct.hidden=true};
  svg.addEventListener('pointerdown',ev=>{drag={x0:pos(ev).x};svg.setPointerCapture(ev.pointerId)});
  svg.addEventListener('pointermove',ev=>{
    const p=pos(ev);
    if(drag){const x1=Math.min(drag.x0,p.x),x2=Math.max(drag.x0,p.x);sel.setAttribute('x',x1);sel.setAttribute('width',x2-x1);sel.setAttribute('visibility',x2-x1>6?'visible':'hidden');ct.hidden=true;return}
    const x=X(p.i);xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.setAttribute('visibility','visible');
    c.series.forEach((s,k)=>{hd[k].setAttribute('cx',x);hd[k].setAttribute('cy',Y(s.v[p.i]));hd[k].setAttribute('visibility','visible')});
    ct.innerHTML=c.tipFn(p.i);ct.hidden=false;
    const wr=el.getBoundingClientRect(),px=(ev.clientX-wr.left),tw=ct.offsetWidth;
    ct.style.left=(px+16+tw>wr.width?px-tw-16:px+16)+'px';
    ct.style.top=Math.max(4,Math.min(ev.clientY-wr.top-20,H-ct.offsetHeight-4))+'px';
  });
  svg.addEventListener('pointerup',ev=>{
    if(!drag)return;const p=pos(ev),x0=drag.x0;drag=null;sel.setAttribute('visibility','hidden');
    if(Math.abs(p.x-x0)>10){const i0=Math.round(a+(Math.min(x0,p.x)-m.l)/pw*span),i1=Math.round(a+(Math.max(x0,p.x)-m.l)/pw*span);
      if(i1-i0>=5){if(c.onZoom)c.onZoom(i0,i1);else{view=[Math.max(0,i0),Math.min(c.n-1,i1)];drawCharts()}}}});
  svg.addEventListener('pointerleave',()=>{if(!drag)hide()});
  svg.addEventListener('pointercancel',()=>{drag=null;sel.setAttribute('visibility','hidden');hide()});
  svg.addEventListener('dblclick',()=>{if(c.onReset)c.onReset();else if(view){view=null;drawCharts()}});
}

      ts.map(t=>`<div class="${t.shares>0?'buy':'sell'}" style="margin-top:3px">${t.type}　${t.shares>0?'+':''}${t.shares.toLocaleString()} 股　${t.eBefore.toFixed(2)}→${t.eAfter.toFixed(2)}</div>`).join('')}});

let SCAN=null,scanMetric='mincash',scanSel=null,TAB='backtest';

const fmtW=v=>Math.abs(v)>=1e8?(v/1e8).toFixed(1)+'億':(Math.round(v/1e4)||0).toLocaleString('en-US')+'萬';
function niceTicks(lo,hi,k){const raw=(hi-lo)/k,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag,step=(f<1.5?1:f<3?2:f<7?5:10)*mag,o=[];for(let v=Math.ceil(lo/step)*step;v<=hi+step*1e-9;v+=step)o.push(Math.abs(v)<step*1e-9?0:v);return o}
const METRICS={mincash:['最低現金水位',r=>r.res.minCash,fmtW],mdd:['最大回撤',r=>r.res.mdd,v=>(v*100).toFixed(0)+'%'],cagr:['年化報酬率',r=>r.res.cagr,v=>(v*100).toFixed(0)+'%'],final:['期末總資產',r=>r.res.final,fmtW]};
function runScan(){
  const p=params(),box=$('scanout');
  if(!(p.capital>0)||!(p.pct>0)||!(p.target>0)||!p.start||!p.end){box.innerHTML='<div class="card alert">請填入有效的資金、比例、目標曝險與起訖日期。</div>';return}

  DATA=buildPrices(cost);
  const win=parseFloat($('win').value)||0,seen=new Set(),rows=[];
  for(const r of DATA){
    if(r[0]<p.start||r[0]>=p.end)continue;
    const m=r[0].slice(0,7);if(seen.has(m))continue;seen.add(m);
    let end=p.end;if(win>0){const e=addYears(r[0],win);if(e<end)end=e}

function groupDepleted(rows){

    const worst=sub.reduce((a,b)=>b.res.minCash<a.res.minCash?b:a);

const isNum=x=>x!==''&&x!=null&&isFinite(+x);
function feeOf(r,s){return isNum(r.fee)?+r.fee:Math.round(r.price*r.shares*0.001425*(+s.disc))}

function stepRow(st,r,s){

  else if(r.type==='sell'){
    let n=r.shares;if(n>st.shares){w.push('賣出股數超過持股');n=st.shares}

  }else if(r.type==='withdraw')st.cash-=r.amount;
  else if(r.type==='deposit')st.cash+=r.amount;
  if(st.cash<0)w.push('現金為負');
  return w;
}
function runLedger(pf){
  const s=pf.settings,st={shares:0,cash:+s.capital,cost:0,realized:0},rows=[];
  for(const r of ledgerSorted(pf)){const w=stepRow(st,r,s);rows.push({r,st:{...st},w})}
  return{rows,st};
}
function trigCalc(st,P,s){
  const tgt=+s.target,hi=tgt*(1+s.up/100),lo=tgt*(1-s.dn/100);
  const V=st.shares*P,T=V+st.cash,E=T>0?2*V/T:0;
  const act=p=>{const v=st.shares*p,t=v+st.cash,n=(v-tgt*t/2)/p;return{n:n>=0?Math.floor(n):-Math.floor(-n),exp:t>0?2*v/t:0}};
  const ok=st.shares>0&&st.cash>0;
  const pSell=ok&&hi<2?hi*st.cash/(st.shares*(2-hi)):null;
  const pBuy=ok&&lo<2&&lo>0?lo*st.cash/(st.shares*(2-lo)):null;
  return{tgt,hi,lo,V,T,E,P,now:act(P),pSell,pBuy,aSell:pSell?act(pSell):null,aBuy:pBuy?act(pBuy):null};
}
function posHistory(pf){
  const L=ledgerSorted(pf);if(!L.length)return null;
  const s=pf.settings,first=L[0].date,st={shares:0,cash:+s.capital,cost:0,realized:0};let p=0;
  const D=[],Ep=[],Eq=[],trade=[];
  for(const [d,c] of R631){
    if(d<first)continue;
    const T0=st.shares*c+st.cash,pre=st.shares>0&&T0>0?2*st.shares*c/T0:null,acts=[];
    while(p<L.length&&L[p].date<=d){stepRow(st,L[p],s);acts.push(L[p]);p++}
    const T1=st.shares*c+st.cash;
    D.push(d);Ep.push(pre);Eq.push(st.shares>0&&T1>0?2*st.shares*c/T1:0);trade.push(acts.filter(a=>a.type==='buy'||a.type==='sell'));
  }
  return{D,Ep,Eq,trade};
}

const TIERS=[{k:'cons',name:'保守',desc:'回撤小，報酬較低',ok:r=>r.md>=-0.30},
  {k:'bal',name:'平衡',desc:'報酬與回撤居中',ok:r=>r.md<-0.30&&r.md>=-0.37},
  {k:'agg',name:'進取',desc:'報酬較高，回撤也大',ok:r=>r.md<-0.37}];
function optTiers(ranked){
  const best=ranked.length?ranked[0].rank:0;
  return TIERS.map(d=>{const pool=ranked.filter(d.ok),good=pool.filter(r=>r.rank>=0.85*best&&r.plat>0);
    const pick=(good.length?good:pool)[0]||null;return{...d,pick,relaxed:!good.length&&!!pool.length}});
}
async function optRun(){
  if(OPT.running)return;OPT.running=true;OPT.cancel=false;const LASTU=LAST;OPT.lastUsed=LASTU;
  const prog=$('o_prog'),btn=$('o_run'),cb=$('o_cancel');btn.disabled=true;cb.hidden=false;
  DATA=buildPrices(OPT_COST);
  const WN=optWindows(),G=optGrid(OPT.adv),total=G.cs.length*WN.length+G.P.length*WN.length;let done=0,t0=Date.now();
  const res=G.cs.map(()=>Array(WN.length)),base={};
  const tick=async()=>{prog.textContent=`運算中… ${Math.round(done/total*100)}%（${done.toLocaleString('en-US')} / ${total.toLocaleString('en-US')}）`;await new Promise(r=>setTimeout(r,0))};
  for(const pct of G.P){base[pct]=[];for(let j=0;j<WN.length;j++){base[pct][j]=optSim({pct,tg:2*pct,up:.1,dn:.1},WN[j],{rebalance:false});done++}}
  for(let i=0;i<G.cs.length;i++){
    if(OPT.cancel){OPT.running=false;btn.disabled=false;cb.hidden=true;prog.textContent='已取消';return}
    for(let j=0;j<WN.length;j++){res[i][j]=optSim(G.cs[i],WN[j]);done++}
    if(i%12===0)await tick();
  }
  const all=WN.map((_,j)=>j);
  const ranked=optSelect(G,res,all,true),tiers=optTiers(ranked);
  const tiersEq=optTiers(optSelect(G,res,all,false));
  const oos=[];
  for(const cut of ['2019-12-31','2016-12-31']){
    const idx=all.filter(j=>WN[j].e<=cut);if(idx.length<3)continue;
    const tr=optTiers(optSelect(G,res,idx,true)),test={s:cut.slice(0,4)*1+1+'-01-01',e:LASTU};
    oos.push({cut,nWin:idx.length,test,rows:tr.map(t=>{if(!t.pick)return{t};const c=t.pick.c;
      return{t,pick:c,a:optSim(c,test),b:optSim({pct:c.pct,tg:c.tg,up:c.up,dn:c.dn},test,{rebalance:false})}})});
  }
  OPT.res={G,WN,res,base,tiers,tiersEq,ranked,oos,adv:OPT.adv,secs:(Date.now()-t0)/1000,sims:total,sel:'bal'};
  OPT.running=false;btn.disabled=false;cb.hidden=true;OPT.ran=true;prog.textContent='';renderOptResult();
  if(OPT.lastUsed!==LAST&&TAB==='opt')optRun();
}
const pctS=(x,d=1)=>(x*100).toFixed(d)+'%';
const cStr=c=>`投入 ${Math.round(c.pct*100)}%｜目標 ${c.tg.toFixed(2)}｜上緣 +${Math.round(c.up*100)}%｜下緣 −${Math.round(c.dn*100)}%`;
function optStats(R,r){
  const {res,base,WN}=R,i=r.i,c=r.c,n=WN.length,W=optWeights(n),sw=W.reduce((a,b)=>a+b,0);
  let cg=0,md=0,beat=0,worst=0;
  for(let j=0;j<n;j++){const x=res[i][j];cg+=x.cagr*W[j]/sw;md+=x.mdd*W[j]/sw;worst=Math.min(worst,x.mdd);if(x.calmar>base[c.pct][j].calmar)beat++}
  const ratio=r.own>0?r.plat/r.own:0;
  let label,cls;
  if(ratio>=0.9&&r.sd<=Math.abs(r.plat)*0.15){label='高原型：周圍參數表現相近';cls='okc'}
  else if(ratio>=0.75){label='尚可：周圍略有起伏';cls=''}
  else{label='偏尖峰：稍微調整就會變差，請小心';cls='badc'}
  return{cg,md,beat,worst,ratio,label,cls,n};
}
function optWinTable(R,t){
  const {WN,res,base}=R,W=optWeights(WN.length),b0=t.pick;
  return `<div class="logbox tw"><table><tr><th class="l">區間</th><th>權重</th><th class="l">價格</th><th>此組 年化</th><th>回撤</th><th>報酬÷回撤</th><th>不再平衡 年化</th><th>回撤</th><th>報酬÷回撤</th><th class="l">此區間自己的最高分參數</th></tr>`+
   WN.map((w,j)=>{const a=res[b0.i][j],b=base[b0.c.pct][j];let pk=0;for(let i=1;i<R.G.cs.length;i++)if(res[i][j].calmar>res[pk][j].calmar)pk=i;
     return `<tr><td class="l">${w.s} ～ ${w.e}${w.recent?'（最近 10 年）':''}</td><td>${W[j].toFixed(2)}</td><td class="l ${w.est?'est':''}">${w.est?'含 0050 推估':'真實'}</td><td>${pctS(a.cagr)}</td><td>${pctS(a.mdd)}</td><td>${a.calmar.toFixed(2)}</td><td>${pctS(b.cagr)}</td><td>${pctS(b.mdd)}</td><td>${b.calmar.toFixed(2)}</td><td class="l">${esc(cStr(R.G.cs[pk]))}（${res[pk][j].calmar.toFixed(2)}）</td></tr>`}).join('')+`</table></div>`;
}
function renderOptResult(){

  tiers.forEach((t,k)=>{
    if(!t.pick){h+=`<div class="tier"><h4>${t.name}<small>${t.desc}</small></h4><p class="note">在這個風險範圍內，找不到合格的高原型參數。</p></div>`;return}

     <table class="mini"><tr><td class="l">10 年區間平均年化</td><td>${pctS(s.cg)}</td></tr><tr><td class="l">平均最大回撤</td><td>${pctS(s.md)}</td></tr><tr><td class="l">最差 10 年區間的回撤</td><td>${pctS(s.worst)}</td></tr><tr><td class="l">勝過不再平衡</td><td>${s.beat} / ${n} 個區間</td></tr></table>
     <p class="note ${s.cls}" style="margin:8px 0 2px">${esc(s.label)}（周圍平均 ${(s.ratio*100).toFixed(0)}%）</p>

  h+=`<section class="card"><h3>把握度檢查<span class="sub">只用較早的區間選參數，再看它在後來的行情表現</span></h3>`;
  if(oos.length){
    h+=`<div class="tw"><table><tr><th class="l">選參數時只用到</th><th class="l">等級</th><th class="l">選出的參數</th><th class="l">之後的檢驗期間</th><th>年化</th><th>最大回撤</th><th>不再平衡年化</th><th>不再平衡回撤</th><th class="l">結論</th></tr>`+
    oos.map(o=>o.rows.map(x=>{if(!x.pick)return `<tr><td class="l">${o.nWin} 個區間（終點 ≤ ${o.cut}）</td><td class="l">${x.t.name}</td><td class="l" colspan="7" style="color:var(--mute)">沒有合格的高原型參數</td></tr>`;

  }else h+='<p class="note">資料不足，無法做這項檢查。</p>';
  h+=`</section>`;
  h+=`<section class="card"><h3>這個結果是怎麼選出來的</h3><ul class="fmt">
   <li>固定條件：總資金 1000 萬、不提領、手續費折扣 0.6、證交稅 0.1%、推估年耗損 3.1%、現金無利息。</li>
   <li>搜尋範圍：首次投入 30%～90%（每 10%）；上緣、下緣各 5%～30%（每 5%）；${R.adv?'目標曝險 0.8～1.6（每 0.1），獨立於投入比例':'目標曝險 ＝ 2 × 投入比例'}。上緣超過曝險上限 2 的組合會被排除。</li>

   <li>單一區間的分數 ＝ 年化報酬 ÷ 最大回撤。一組參數的分數 ＝ 70% 加權平均 ＋ 30% 最差 10 年區間；權重從最早區間 1 線性增加到最近區間 ${OPT_W_NEW}。</li>

  h+=`<section class="card"><h3>各 10 年區間明細<span class="sub">給有興趣的時候瀏覽</span></h3>
